<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExcelPilot</title>
  <!-- Office.js CDN -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background-color: #eef2f6;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    #root {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(147, 180, 245, 0.25);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b82f6;
    }
    /* Hide any injected floating task-pane info (i) overlay. */
    body > *:not(#root),
    #mso-taskpane-notification-bar,
    .ms-Taskpane-notification,
    button[aria-label*="info" i],
    button[title*="info" i],
    a[aria-label*="info" i],
    a[title*="info" i],
    div[aria-label*="info" i],
    div[title*="info" i],
    span[aria-label*="info" i],
    .office-app-info,
    #office-start-notification,
    #office-info-button,
    .ms-ContextualMenu,
    [data-automation-id*="info" i] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
